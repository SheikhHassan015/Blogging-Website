name: wf-deploy-development
on:
  push:
    branches:
      - develop
      
jobs:
  wf-deploy-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build website
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

      - name: Upload Artifacts 
        uses: actions/upload-artifact@v3
        with: 
          path: "./dist"
          name: "develop-artifact"

  wf-deploy-development-jobs: 
    needs: wf-deploy-development-job
    permissions: 
      pages: write
      id-token: write
    environment: "development-env"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy build artifacts on GitHub Pages
        uses: actions/deploy-pages@v4
        with: 
          artifact_name: "develop-artifact"  
          token: ${{ secrets.GITHUB_TOKEN }}  
